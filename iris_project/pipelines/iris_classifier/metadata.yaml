blocks:
- name: load_iris
  type: data_loader
  uuid: load_iris
  upstream_blocks: []
  downstream_blocks: [validate_iris]
  all_upstream_blocks_executed: true
  status: not_executed
- name: prepare_data
  type: transformer
  uuid: prepare_data
  upstream_blocks: [validate_iris]
  downstream_blocks: [train_model]
  all_upstream_blocks_executed: true
  status: not_executed
- name: train_model
  type: transformer
  uuid: train_model
  upstream_blocks: [prepare_data]
  downstream_blocks: [save_results, evaluate_model]
  all_upstream_blocks_executed: true
  status: not_executed
- name: save_results
  type: data_exporter
  uuid: save_results
  upstream_blocks: [train_model]
  downstream_blocks: []
  all_upstream_blocks_executed: true
  status: not_executed
- name: evaluate_model
  type: transformer
  uuid: evaluate_model
  upstream_blocks: [train_model]
  downstream_blocks: []
  all_upstream_blocks_executed: true
  status: not_executed
- name: validate_iris
  type: transformer
  uuid: validate_iris
  upstream_blocks: [load_iris]
  downstream_blocks: [prepare_data]
  all_upstream_blocks_executed: true
  status: not_executed
name: iris_classifier
type: python
uuid: iris_classifier
widgets: []
